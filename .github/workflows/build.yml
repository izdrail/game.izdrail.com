name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest   # GitHub-hosted for now; self-hosted Predator runner is down
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libglfw3-dev libassimp-dev libfreetype6-dev libgl1-mesa-dev libgl1-mesa-dri xvfb libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGAME_ASSET_PATH=assets
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: scripts/package.sh game-linux-x86_64 game
      - name: Verify package extracts and binary starts
        run: |
          rm -rf /tmp/pkgcheck && mkdir /tmp/pkgcheck
          tar -xzf dist/game-linux-x86_64.tar.gz -C /tmp/pkgcheck
          test -x /tmp/pkgcheck/game-linux-x86_64/game
          test -d /tmp/pkgcheck/game-linux-x86_64/assets/shaders
          if ldd /tmp/pkgcheck/game-linux-x86_64/game | grep -q "not found"; then echo "missing shared libs"; exit 1; fi
      - name: Smoke test packaged game (xvfb + software GL)
        run: |
          cd /tmp/pkgcheck/game-linux-x86_64
          set +e
          echo forest | LIBGL_ALWAYS_SOFTWARE=1 timeout 15 xvfb-run -a -s "-screen 0 1280x720x24" ./run.sh > smoke.log 2>&1
          code=$?
          cat smoke.log | head -30
          # 124 = still running when the timeout hit = started fine
          if [ "$code" -ne 124 ]; then echo "game exited early with code $code"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: game-linux-x86_64
          path: dist/game-linux-x86_64.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Summary
        run: echo "Artifact game-linux-x86_64 (commit $GITHUB_SHA) is attached to this run." >> "$GITHUB_STEP_SUMMARY"

  # macOS arm64 job removed: GitHub could not allocate a macos-14 runner for this repo
  # (job cancelled in 1s with no steps). Re-add once a macOS runner is available.
