name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: self-hosted   # project CI rule: self-hosted runner
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libglfw3-dev libassimp-dev libfreetype6-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGAME_ASSET_PATH=assets
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: scripts/package.sh game-linux-x86_64 game
      - name: Verify package extracts and binary starts
        run: |
          rm -rf /tmp/pkgcheck && mkdir /tmp/pkgcheck
          tar -xzf dist/game-linux-x86_64.tar.gz -C /tmp/pkgcheck
          test -x /tmp/pkgcheck/game-linux-x86_64/game
          test -d /tmp/pkgcheck/game-linux-x86_64/assets/shaders
          ldd /tmp/pkgcheck/game-linux-x86_64/game | grep -q "not found" && { echo "missing shared libs"; exit 1; } || true
      - uses: actions/upload-artifact@v4
        with:
          name: game-linux-x86_64
          path: dist/game-linux-x86_64.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Summary
        run: echo "Artifact game-linux-x86_64 (commit $GITHUB_SHA) is attached to this run." >> "$GITHUB_STEP_SUMMARY"

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake glfw assimp freetype pkg-config
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGAME_ASSET_PATH=assets
      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: scripts/package.sh game-macos-arm64 game
      - name: Verify package extracts
        run: |
          rm -rf /tmp/pkgcheck && mkdir /tmp/pkgcheck
          tar -xzf dist/game-macos-arm64.tar.gz -C /tmp/pkgcheck
          test -x /tmp/pkgcheck/game-macos-arm64/game
          test -d /tmp/pkgcheck/game-macos-arm64/assets/shaders
      - uses: actions/upload-artifact@v4
        with:
          name: game-macos-arm64
          path: dist/game-macos-arm64.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Summary
        run: echo "Artifact game-macos-arm64 (commit $GITHUB_SHA) is attached to this run." >> "$GITHUB_STEP_SUMMARY"
